# Dependabot version updates: one weekly pull request per ecosystem and directory, minor and patch updates grouped.
# Security updates for vulnerable dependencies come as soon as an advisory is published, independent of this schedule.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /   # Directory.Packages.props: central package versions for every project in Cuebot.slnx
    schedule: { interval: weekly }
    groups:
      nuget-minor:
        update-types: [minor, patch]
    ignore:
      # SkiaSharp moves with Avalonia (Avalonia.Skia pins its version), never on its own.
      - dependency-name: 'SkiaSharp*'
        update-types: [version-update:semver-major]
      # xunit.v3 4 needs Microsoft.Testing.Platform on .NET 10, and Cuebot.Tests is still on xunit v2 (VSTest).
      - dependency-name: xunit.v3
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directories: [/portal, /relay, /report, /streamdeck]
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node that runs the code: 24 for the builds, 20 inside Stream Deck.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directory: /clients/android
    schedule: { interval: weekly }
    groups:
      gradle-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /website
    schedule: { interval: weekly }
    groups:
      pip-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']

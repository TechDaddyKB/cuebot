name: android

# Cuebot Companion for Android (clients/android): unit tests, lint and a debug APK on every change there; the
# Compose UI tests on an emulator; and, when run by hand with "signed release", a release APK signed with the
# release key, to prove the signing secrets work (the real release build is the android job in release.yml).
on:
  push:
    paths: ['clients/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['clients/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      signed_release:
        description: Also build a release APK signed with the release key
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: cuebot-companion-debug-apk
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-reports
          path: |
            clients/android/core/build/reports
            clients/android/app/build/reports

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Let the emulator use KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: clients/android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-ui-test-reports
          path: clients/android/app/build/reports/androidTests

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ci/release.sh "0.0.0-ci.${{ github.run_number }}" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v5
        with:
          name: cuebot-companion-release
          path: clients/android/dist/*

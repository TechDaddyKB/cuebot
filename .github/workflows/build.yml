name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng python3
      - run: dotnet test Cuebot.slnx -c Release

  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: ./build/publish.ps1 -Runtimes win-x64
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: Cuebot-win-x64
          path: artifacts/Cuebot-win-x64.zip

  linux-package:
    needs: test
    runs-on: ubuntu-24.04   # pinned: its sway 1.9 is what makes Avalonia fail on Wayland for the X11-fallback smoke test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xdotool scrot sway grim jq weston dbus-x11
      - name: Build AppImage
        run: packaging/linux/build-appimage.sh linux-x64
      - uses: actions/upload-artifact@v5
        with:
          name: Cuebot-x86_64.AppImage
          path: artifacts/Cuebot-x86_64.AppImage
      - name: Build Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=artifacts/flatpak-repo --force-clean \
            artifacts/flatpak-build packaging/flatpak/io.github.cuebot.Cuebot.yml
          flatpak build-bundle artifacts/flatpak-repo artifacts/Cuebot-x86_64.flatpak io.github.cuebot.Cuebot
          flatpak install --user -y --noninteractive artifacts/Cuebot-x86_64.flatpak
      - uses: actions/upload-artifact@v5
        with:
          name: Cuebot-x86_64.flatpak
          path: artifacts/Cuebot-x86_64.flatpak
      - name: Smoke test on Wayland (native backend, no X server), X11, Wayland-to-X11 fallback and hung-Wayland watchdog
        run: |
          # Ubuntu 24.04's sway 1.9 only offers xdg_wm_base v2 (Avalonia needs v3+), so native Wayland is
          # tested on weston here (and on current sway in the Arch job); old sway exercises the X11 fallback.
          status=0
          flatpak_data="$HOME/.var/app/io.github.cuebot.Cuebot/config/Cuebot"
          for mode in wayland-weston x11; do
            dbus-run-session -- packaging/linux/smoke-test.sh $mode appimage artifacts/Cuebot-x86_64.AppImage --appimage-extract-and-run || status=1
            SMOKE_STOP="flatpak kill io.github.cuebot.Cuebot" SMOKE_APP_DATA="$flatpak_data" dbus-run-session -- packaging/linux/smoke-test.sh $mode flatpak flatpak run io.github.cuebot.Cuebot || status=1
          done
          dbus-run-session -- packaging/linux/smoke-test.sh fallback appimage artifacts/Cuebot-x86_64.AppImage --appimage-extract-and-run || status=1
          dbus-run-session -- packaging/linux/smoke-test.sh hang appimage artifacts/Cuebot-x86_64.AppImage --appimage-extract-and-run || status=1
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-smoke-test
          path: artifacts/smoke-*

  arch-package:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and test tools
        run: |
          pacman -Syu --noconfirm --needed git dotnet-sdk aspnet-targeting-pack aspnet-runtime namcap sway grim jq xorg-server-xvfb xdotool scrot mesa dbus
          # sway ships with a file capability (cap_sys_nice) that containers refuse to exec; a plain copy works
          install -m755 /usr/bin/sway /usr/local/bin/sway
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v5
      - name: Build both AUR packages from this commit
        run: |
          git config --global --add safe.directory '*'
          version=$(grep -m1 '^pkgver=' packaging/aur/cuebot/PKGBUILD | cut -d= -f2)
          work=/tmp/aur; mkdir -p "$work/cuebot" "$work/cuebot-bin"

          # cuebot: source build from a tarball of this commit, in place of the release tag archive
          git archive --format=tar.gz --prefix="cuebot-$version/" -o "$work/cuebot/cuebot-$version.tar.gz" HEAD
          sed -e "s|^source=.*|source=(\"cuebot-$version.tar.gz\")|" packaging/aur/cuebot/PKGBUILD > "$work/cuebot/PKGBUILD"

          # cuebot-bin: the self-contained release tarball built from this commit
          packaging/linux/build-tarball.sh "$version" linux-x64
          cp "artifacts/Cuebot-$version-linux-x64.tar.gz" "$work/cuebot-bin/"
          sed -e "s|^source_x86_64=.*|source_x86_64=(\"Cuebot-$version-linux-x64.tar.gz\")|" packaging/aur/cuebot-bin/PKGBUILD > "$work/cuebot-bin/PKGBUILD"

          chown -R builder "$work"
          for pkg in cuebot cuebot-bin; do
            su builder -c "cd $work/$pkg && makepkg --syncdeps --noconfirm"
            namcap "$work/$pkg/PKGBUILD" "$work/$pkg"/*.pkg.tar.zst | tee "artifacts/namcap-$pkg.txt"
          done
          cp "$work"/*/*.pkg.tar.zst artifacts/
      - name: Install and smoke test cuebot
        run: |
          pacman -U --noconfirm artifacts/cuebot-[0-9]*.pkg.tar.zst
          chown -R builder artifacts
          status=0
          for mode in wayland x11; do
            su builder -c "dbus-run-session -- packaging/linux/smoke-test.sh $mode arch cuebot" || status=1
          done
          exit $status
      - name: Install and smoke test cuebot-bin
        if: always()
        run: |
          pacman -Rns --noconfirm cuebot || true
          pacman -U --noconfirm artifacts/cuebot-bin-*.pkg.tar.zst
          status=0
          for mode in wayland x11; do
            su builder -c "dbus-run-session -- packaging/linux/smoke-test.sh $mode arch-bin cuebot" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: arch-packages
          path: |
            artifacts/*.pkg.tar.zst
            artifacts/namcap-*.txt
            artifacts/smoke-*

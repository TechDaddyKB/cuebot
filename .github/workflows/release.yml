name: release

# Push a tag like v0.1.0 to publish a GitHub release and prepare the AUR packages. A tag with a hyphen (v0.1.0-rc.1) is
# a release candidate: a GitHub pre-release (the app's pre-release update channel sees it), and nothing goes to the AUR.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # the Windows package job signs with Azure Artifact Signing through OpenID Connect (docs/CODE_SIGNING.md)

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit   # the built-in app credentials (docs/BUILT_IN_APPS.md)

  tarballs:
    needs: build   # for Cuebot's ffmpeg (the build workflow's ffmpeg job)
    runs-on: ubuntu-latest
    # The OAuth apps registered for Cuebot (docs/BUILT_IN_APPS.md), compiled into the packages. Empty in builds without
    # the secrets (forks, pull requests): those packages ask users for their own apps instead.
    env:
      CUEBOT_TWITCH_CLIENT_ID: ${{ secrets.CUEBOT_TWITCH_CLIENT_ID }}
      CUEBOT_GOOGLE_CLIENT_ID: ${{ secrets.CUEBOT_GOOGLE_CLIENT_ID }}
      CUEBOT_GOOGLE_CLIENT_SECRET: ${{ secrets.CUEBOT_GOOGLE_CLIENT_SECRET }}
      CUEBOT_GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.CUEBOT_GOOGLE_DEVICE_CLIENT_ID }}
      CUEBOT_GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.CUEBOT_GOOGLE_DEVICE_CLIENT_SECRET }}
      CUEBOT_KICK_CLIENT_ID: ${{ secrets.CUEBOT_KICK_CLIENT_ID }}
      CUEBOT_KICK_CLIENT_SECRET: ${{ secrets.CUEBOT_KICK_CLIENT_SECRET }}
      CUEBOT_TREATSTREAM_CLIENT_ID: ${{ secrets.CUEBOT_TREATSTREAM_CLIENT_ID }}
      CUEBOT_TREATSTREAM_CLIENT_SECRET: ${{ secrets.CUEBOT_TREATSTREAM_CLIENT_SECRET }}
      CUEBOT_PORTAL_GOOGLE_CLIENT_ID: ${{ secrets.CUEBOT_PORTAL_GOOGLE_CLIENT_ID }}
      CUEBOT_PORTAL_GOOGLE_CLIENT_SECRET: ${{ secrets.CUEBOT_PORTAL_GOOGLE_CLIENT_SECRET }}
      CUEBOT_PORTAL_TWITCH_CLIENT_ID: ${{ secrets.CUEBOT_PORTAL_TWITCH_CLIENT_ID }}
      CUEBOT_PORTAL_TWITCH_CLIENT_SECRET: ${{ secrets.CUEBOT_PORTAL_TWITCH_CLIENT_SECRET }}
      CUEBOT_PORTAL_DISCORD_CLIENT_ID: ${{ secrets.CUEBOT_PORTAL_DISCORD_CLIENT_ID }}
    steps:
      - name: Report built-in apps missing from this release
        run: |
          for name in TWITCH_CLIENT_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_DEVICE_CLIENT_ID GOOGLE_DEVICE_CLIENT_SECRET \
                      KICK_CLIENT_ID KICK_CLIENT_SECRET TREATSTREAM_CLIENT_ID TREATSTREAM_CLIENT_SECRET \
                      PORTAL_GOOGLE_CLIENT_ID PORTAL_GOOGLE_CLIENT_SECRET PORTAL_TWITCH_CLIENT_ID PORTAL_TWITCH_CLIENT_SECRET \
                      PORTAL_DISCORD_CLIENT_ID; do
            var="CUEBOT_$name"
            [ -n "${!var}" ] || echo "::warning::Secret $var is not set: this release asks users for their own app there."
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-linux-*
          path: artifacts/ffmpeg-download
      - run: |
          for rid in linux-x64 linux-arm64; do
            mkdir -p artifacts/ffmpeg && mv "artifacts/ffmpeg-download/ffmpeg-$rid" "artifacts/ffmpeg/$rid"
            chmod +x artifacts/ffmpeg/$rid/ff*
          done
          version="${GITHUB_REF_NAME#v}"
          packaging/linux/build-tarball.sh "$version" linux-x64
          packaging/linux/build-tarball.sh "$version" linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tarballs
          path: artifacts/Cuebot-*-linux-*.tar.gz

  # Cuebot Companion for Android: the release APK (attached to the release) and AAB (kept as an artifact for later),
  # signed with the release key when the secrets are set (clients/android/ci/release.sh). versionCode is this
  # workflow's run number, which only goes up.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: clients/android/ci/release.sh "${GITHUB_REF_NAME#v}" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: clients/android/dist/*

  # The desktop packages decide whether a release goes out; Cuebot Companion for Android is attached when its job
  # succeeded and left out (with a warning) when it did not, so an Android problem never holds back a desktop release.
  publish:
    needs: [build, tarballs, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tarballs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          companion=()
          if [ "${{ needs.android.result }}" = success ]; then
            companion=(dist/Cuebot-Companion-*.apk)
          else
            echo "::warning::The android job did not succeed (${{ needs.android.result }}): this release has no Cuebot Companion APK."
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Cuebot $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}" \
            dist/Cuebot-win-x64.zip dist/Cuebot-x86_64.AppImage dist/Cuebot-x86_64.flatpak dist/Cuebot-*-linux-*.tar.gz \
            dist/Cuebot-macos-arm64.dmg dist/Cuebot-macos-x64.dmg \
            dist/io.github.cuebot.streamdeck.streamDeckPlugin \
            dist/Cuebot-StreamController-plugin.zip \
            "${companion[@]}"

  aur:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v7
      - name: Pin versions and checksums, write .SRCINFO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          pacman -S --noconfirm --needed github-cli
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dl
          # The exact files the PKGBUILDs download, so the checksums match.
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_REF_NAME" > /dev/null   # warm the archive
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "dl/cuebot-$version.tar.gz" \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dl --pattern 'Cuebot-*-linux-*.tar.gz'
          useradd -m builder && chown -R builder .
          su builder -c "packaging/aur/prepare.sh $version dl/cuebot-$version.tar.gz dl/Cuebot-$version-linux-x64.tar.gz dl/Cuebot-$version-linux-arm64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: aur-packages
          path: artifacts/aur
          include-hidden-files: true
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          for pkg in cuebot cuebot-bin; do
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "aur-$pkg"
            cp "artifacts/aur/$pkg/PKGBUILD" "artifacts/aur/$pkg/.SRCINFO" "aur-$pkg/"
            git -C "aur-$pkg" -c user.name="TechDaddyKB" -c user.email="camarokris@gmail.com" add PKGBUILD .SRCINFO
            git -C "aur-$pkg" -c user.name="TechDaddyKB" -c user.email="camarokris@gmail.com" commit -m "Update to ${GITHUB_REF_NAME#v}" || true
            git -C "aur-$pkg" push origin HEAD:master
          done

# The Cuebot documentation site (GitHub Pages): https://techdaddykb.github.io/cuebot/
# Build locally: pip install -r website/requirements.txt && mkdocs serve -f website/mkdocs.yml
# The pages under docs/reference/triggers and docs/reference/sub-actions are generated from src/Cuebot.Core/Help
# by tests/Cuebot.UiTests/ActionHelpTests.cs (CUEBOT_WRITE_REFERENCE=1); docs/reference/csharp, script-functions,
# rest-api.md and mcp-tools.md by DeveloperReferenceTests.cs (see docs/WRITING_HELP.md). Do not edit them by hand.
# The screenshots in docs/assets/screens come from tests/Cuebot.UiTests/DocsScreenshots.cs (CUEBOT_WRITE_SCREENSHOTS=1: every
# page, tab and card of the app) and DocsOverlayScreenshots.cs (CUEBOT_WRITE_OVERLAY_SCREENSHOTS=1: the overlay designer,
# widget editors and alert designer, through tools/docs-shots/overlay-shots.mjs; needs Node.js, playwright-core and Chromium).
# Then run tools/docs-shots/prune-unused.sh, so only the pictures a page uses are committed.
site_name: Cuebot Docs
site_description: Stream automation for Twitch, YouTube, Kick and Rumble, explained simply.
site_url: https://techdaddykb.github.io/cuebot/
repo_url: https://github.com/TechDaddyKB/cuebot
repo_name: TechDaddyKB/cuebot
edit_uri: edit/main/website/docs/
copyright: Cuebot is free and open source (MIT licence).

theme:
  name: material
  logo: assets/cuebot.png
  favicon: assets/cuebot.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.keys

plugins:
  - search
  # Click a screenshot to see it full size.
  - glightbox:
      touchNavigation: true
      zoomable: true
  # The guides moved into category folders in November 2026; old links keep working.
  - redirects:
      redirect_maps:
        guides/installation.md: guides/start/installing.md
        guides/getting-started.md: guides/start/first-five-minutes.md
        guides/connecting-platforms.md: guides/platforms/index.md
        guides/actions-and-triggers.md: guides/actions/how-actions-work.md
        guides/flowchart.md: guides/actions/flowchart.md
        guides/variables.md: guides/actions/variables.md
        guides/glossary.md: guides/start/glossary.md
        guides/every-page.md: guides/start/every-page.md
        guides/commands.md: guides/chat/commands.md
        guides/mod-portal.md: guides/mods/mod-portal.md
        guides/overlays.md: guides/overlays/overlays.md
        guides/widget-code.md: guides/overlays/widget-code.md
        guides/text-to-speech.md: guides/sound/text-to-speech.md
        guides/music-and-now-playing.md: guides/sound/now-playing.md
        guides/community.md: guides/chat/points.md
        guides/subathon-and-goals.md: guides/services/subathon-timers.md
        guides/stream-apps-and-devices.md: guides/apps/index.md
        guides/vtuber-apps.md: guides/apps/vtuber/index.md
        guides/stream-deck.md: guides/apps/stream-deck.md
        guides/companion-app.md: guides/mods/phone-app.md
        guides/donations-and-integrations.md: guides/services/tips-and-donations.md
        guides/discord-bot.md: guides/services/discord-bot.md
        guides/assistant.md: guides/ai/assistant.md
        guides/local-models.md: guides/ai/local-models.md
        guides/moving-from-streamer-bot.md: guides/start/moving-from-streamer-bot.md
        guides/servers.md: guides/developers/servers.md
        guides/scripting.md: guides/developers/writing-code.md
        guides/python.md: guides/developers/python.md
        guides/code-editors.md: guides/developers/code-editors.md
        guides/api.md: guides/developers/servers.md
        guides/backups-and-your-data.md: guides/help/backups.md
        guides/linux.md: guides/help/linux.md
